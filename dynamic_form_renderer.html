<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Inspection Form | Hybrid Schema Prototype</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0b2540; --navy2:#123a63; --gold:#c9a227; --gold-l:#e8cf7a;
    --bg:#f3f5f8; --card:#ffffff; --line:#e2e6ec; --text:#1c2733; --muted:#6b7686;
    --ok:#1e8e5a; --fail:#c0392b; --warn:#b8860b;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans Thai',sans-serif;background:var(--bg);color:var(--text);}
  header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:18px 20px;}
  header h1{font-size:18px;margin:0;font-weight:700;}
  header .sub{font-size:12px;color:var(--gold-l);margin-top:2px;}
  main{max-width:1100px;margin:0 auto;padding:20px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .card h2{font-size:16px;margin:0 0 4px;color:var(--navy);border-left:4px solid var(--gold);padding-left:10px;}
  .card .desc{font-size:12px;color:var(--muted);margin:0 0 14px;padding-left:14px;}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  select,input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-family:inherit;font-size:14px;background:#fbfcfd;}
  select:focus,input:focus{outline:none;border-color:var(--navy2);background:#fff;}
  .machine-picker{display:flex;gap:12px;align-items:end;flex-wrap:wrap;}
  .machine-picker > div{flex:1;min-width:220px;}
  .family-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:#eef2f8;color:var(--navy2);margin-left:8px;vertical-align:middle;}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
  th,td{border:1px solid var(--line);padding:6px 8px;text-align:center;}
  th{background:#f0f3f7;color:var(--navy);font-weight:700;font-size:12px;}
  .gun-table td:first-child, .gun-table th:first-child{text-align:left;background:#f7f9fb;font-weight:600;width:150px;}
  .std-cell{color:var(--muted);font-size:11.5px;}
  .act-input{width:70px;padding:5px;text-align:center;}
  .grid35{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px;margin-top:8px;}
  .pallet-btn{border:1px solid var(--line);border-radius:7px;padding:7px 4px;text-align:center;cursor:pointer;font-size:11.5px;background:#fbfcfd;user-select:none;}
  .pallet-btn .num{font-size:10.5px;color:var(--muted);}
  .pallet-btn .mark{font-size:15px;font-weight:800;}
  .pallet-btn.ok{background:#eafaf1;border-color:var(--ok);color:var(--ok);}
  .pallet-btn.ng{background:#fdecea;border-color:var(--fail);color:var(--fail);}
  .pass{color:var(--ok);font-weight:700;}
  .fail{color:var(--fail);font-weight:700;background:#fdecea;}
  .sect-title{font-size:13px;font-weight:700;color:var(--navy);margin:16px 0 8px;}
  .hint{font-size:11.5px;color:var(--muted);margin-top:6px;}
  .config-preview{background:#0b2540;color:#c9e0ff;font-family:'SF Mono',Menlo,monospace;font-size:11px;padding:12px 14px;border-radius:9px;overflow-x:auto;white-space:pre;margin-top:10px;max-height:220px;overflow-y:auto;}
  .toggle-json{font-size:11.5px;color:var(--navy2);cursor:pointer;text-decoration:underline;margin-top:8px;display:inline-block;}
  .empty{color:var(--muted);text-align:center;padding:30px;font-size:13px;}
  .btn{background:var(--navy);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;}
  .btn.gold{background:var(--gold);color:var(--navy);}
</style>
</head>
<body>

<header>
  <h1>⚙️ Dynamic Inspection Form Renderer</h1>
  <div class="sub">Prototype: อ่าน config JSON จากตาราง machines แล้ว render ฟอร์มตาม family อัตโนมัติ</div>
</header>

<main>

  <div class="card">
    <h2>เลือกเครื่องจักร / Part</h2>
    <div class="desc">ในของจริงส่วนนี้จะดึงจาก <code>select * from machines</code> — ตอนนี้ใช้ mock data 5 ตัวอย่างแทน family ทั้ง 5 แบบที่เจอในเอกสาร</div>
    <div class="machine-picker">
      <div>
        <label>เครื่องจักร / Part</label>
        <select id="machineSelect" onchange="renderForm()"></select>
      </div>
    </div>
    <div id="familyBadgeArea"></div>
    <span class="toggle-json" onclick="toggleConfigJson()">👁️ ดู config JSON ของเครื่องนี้</span>
    <div id="configJsonBox" class="config-preview" style="display:none"></div>
  </div>

  <div id="formArea"></div>

</main>

<script>
/* ============================================================
   MOCK DATA — จำลอง row จากตาราง machines (แทนที่ด้วย Supabase query จริง)
   select id, family, machine_no, part_name, config from machines;
   ============================================================ */
const MACHINES = [
  {
    id: 1, family: 'spot_nugget',
    machine_no: 'RB168', part_name: 'SILL; ASM FLOOR RR',
    config: {
      guns: ["SERVO GUN"],
      std_sets: { "SERVO GUN": [
        {label:"STD#1", squeeze:30, slope:3, weld:5.0, hold:20, current:4.5, pressure:5.0, tip:16},
        {label:"STD#2", squeeze:30, slope:1, weld:25, hold:20, current:8.5, pressure:5.0, tip:16}
      ]},
      time_unit: "sec",
      points: ["A1","A2","B"],
      nugget_threshold_mm: 4.2,
      driver_check: {style:"pallet", count:35}
    }
  },
  {
    id: 2, family: 'spot_nugget',
    machine_no: 'RB174', part_name: 'RAIL ASM PUBX SIDE UPR, LH',
    config: {
      guns: ["SERVO GUN"],
      std_sets: { "SERVO GUN": [
        {label:"Point# A,B,C · STD#1", squeeze:600, slope:60, weld:600, hold:200, current:3.5, pressure:2.0, tip:16},
        {label:"Point# D · STD#1", squeeze:600, slope:80, weld:440, hold:200, current:3.0, pressure:2.5, tip:16}
      ]},
      time_unit: "ms",
      points: ["A","C","B","D"],
      nugget_threshold_mm: 4.2,
      driver_check: {style:"every_n", n:10, checkpoints:13}
    }
  },
  {
    id: 3, family: 'spot_torque',
    machine_no: 'SS20', part_name: 'SILL SUB ASM FLOOR RR',
    config: {
      guns: ["STATIONARY"],
      std_sets: { "STATIONARY": [
        {label:"CONDITION", squeeze:40, slope:1, weld:15, hold:30, current:12, pressure:4.0, tip:null}
      ]},
      time_unit: "sec",
      points: ["A","B"],
      torque_threshold_kgfcm: 831,
      driver_check: {style:"none"}
    }
  },
  {
    id: 4, family: 'weld_length',
    machine_no: 'WC-CIVIC-093', part_name: 'BEAM, R FR DOOR SKIN LWR',
    config: {
      condition: {current:85, current_tol:20, volt:16, volt_tol:5, gas_flow:25, wire_dia:0.8, wire_type:"MT12"},
      points: [1,2,3,4],
      length_std_min_mm: 20,
      length_std_max_mm: 25
    }
  },
  {
    id: 5, family: 'weld_hammer',
    machine_no: '—', part_name: 'BRACKET; CRANK CASE',
    config: {
      condition: {current:125, current_tol:30, volt:20, volt_tol:15, gas_flow:18, gas_flow_tol:3, wire_dia:0.9, wire_type:"CO2"}
    }
  },
  {
    id: 6, family: 'weld_zeroset',
    machine_no: 'R176-R179', part_name: 'FRAME ASM;PUBX GUARD OTR (REG)',
    config: {
      condition: {current:18, current_tol:3, gas_flow:0.9, wire_type:"CO2"},
      time_slots: ["08:00","13:00","17:30","20:00","01:00","05:30"],
      cadence: "weekly_or_daily"
    }
  }
];

const FAMILY_LABEL = {
  spot_nugget: "🔩 สป๊อต · Nugget Test",
  spot_torque: "🔩 สป๊อต · Test Torque",
  weld_length: "🔧 เชื่อม · วัดความยาวแนวเชื่อม",
  weld_hammer: "🔧 เชื่อม · ค้อนเคาะ + Visual",
  weld_zeroset: "🔧 เชื่อม · Zero Set Log"
};

/* ============================================================
   INIT — เติม dropdown เลือกเครื่อง
   ============================================================ */
function initMachineSelect(){
  const sel = document.getElementById('machineSelect');
  sel.innerHTML = MACHINES.map(m =>
    `<option value="${m.id}">${m.machine_no} — ${m.part_name}</option>`
  ).join('');
}

function toggleConfigJson(){
  const box = document.getElementById('configJsonBox');
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
}

/* ============================================================
   MAIN ROUTER — เลือก render function ตาม family
   ============================================================ */
function renderForm(){
  const id = Number(document.getElementById('machineSelect').value);
  const machine = MACHINES.find(m => m.id === id);
  const area = document.getElementById('formArea');
  const badgeArea = document.getElementById('familyBadgeArea');
  const jsonBox = document.getElementById('configJsonBox');

  badgeArea.innerHTML = `<span class="family-badge">${FAMILY_LABEL[machine.family]}</span>`;
  jsonBox.textContent = JSON.stringify(machine.config, null, 2);

  const renderers = {
    spot_nugget: renderSpotForm,
    spot_torque: renderSpotForm,
    weld_length: renderWeldLengthForm,
    weld_hammer: renderWeldHammerForm,
    weld_zeroset: renderWeldZerosetForm
  };
  area.innerHTML = renderers[machine.family](machine);
  if (machine.family.startsWith('spot')) attachPalletHandlers(machine);
}

/* ---------- 1) SPOT (nugget หรือ torque ใช้โครงร่วมกัน) ---------- */
function renderSpotForm(m){
  const cfg = m.config;
  const metricLabel = m.family === 'spot_nugget'
    ? `Nugget Diameter (mm) — เกณฑ์ ≥ ${cfg.nugget_threshold_mm}`
    : `Test Torque (kgf.cm) — เกณฑ์ ≥ ${cfg.torque_threshold_kgfcm}`;

  let html = `<div class="card"><h2>1) เงื่อนไข STD vs ACT</h2><div class="desc">หน่วยเวลา: ${cfg.time_unit}</div>`;
  cfg.guns.forEach(gunLabel=>{
    html += `<div class="sect-title">${gunLabel}</div><table class="gun-table"><tr>
      <th>ชุดเงื่อนไข</th><th>Squeeze</th><th>Slope</th><th>Weld</th><th>Hold</th><th>Current</th><th>Pressure</th><th>Tip</th>
    </tr>`;
    (cfg.std_sets[gunLabel]||[]).forEach(std=>{
      html += `<tr>
        <td>${std.label}<div class="std-cell">STD</div></td>
        <td>${std.squeeze}<div class="std-cell">±</div></td>
        <td>${std.slope}</td>
        <td>${std.weld}</td>
        <td>${std.hold}</td>
        <td>${std.current}</td>
        <td>${std.pressure}</td>
        <td>${std.tip ?? '-'}</td>
      </tr>
      <tr style="background:#fbfcfd">
        <td style="text-align:right;font-size:11px;color:var(--muted)">ACT →</td>
        <td><input class="act-input" placeholder="${std.squeeze}"></td>
        <td><input class="act-input" placeholder="${std.slope}"></td>
        <td><input class="act-input" placeholder="${std.weld}"></td>
        <td><input class="act-input" placeholder="${std.hold}"></td>
        <td><input class="act-input" placeholder="${std.current}"></td>
        <td><input class="act-input" placeholder="${std.pressure}"></td>
        <td><input class="act-input" placeholder="${std.tip ?? ''}"></td>
      </tr>`;
    });
    html += `</table>`;
  });
  html += `</div>`;

  html += `<div class="card"><h2>2) ${metricLabel}</h2>
    <table><tr><th>จุดตรวจ</th><th>Start</th><th>Middle</th><th>End</th><th>ผล</th></tr>`;
  cfg.points.forEach(p=>{
    html += `<tr>
      <td><b>${p}</b></td>
      <td><input type="number" step="0.01" class="act-input" id="pt_${p}_start" oninput="checkPoint('${p}', ${m.family==='spot_nugget'?cfg.nugget_threshold_mm:cfg.torque_threshold_kgfcm})"></td>
      <td><input type="number" step="0.01" class="act-input" id="pt_${p}_middle" oninput="checkPoint('${p}', ${m.family==='spot_nugget'?cfg.nugget_threshold_mm:cfg.torque_threshold_kgfcm})"></td>
      <td><input type="number" step="0.01" class="act-input" id="pt_${p}_end" oninput="checkPoint('${p}', ${m.family==='spot_nugget'?cfg.nugget_threshold_mm:cfg.torque_threshold_kgfcm})"></td>
      <td id="pt_${p}_result">-</td>
    </tr>`;
  });
  html += `</table></div>`;

  html += `<div class="card"><h2>3) Driver Check</h2>${renderDriverCheck(cfg.driver_check)}</div>`;
  return html;
}

function checkPoint(p, threshold){
  const s = parseFloat(document.getElementById(`pt_${p}_start`).value);
  const m = parseFloat(document.getElementById(`pt_${p}_middle`).value);
  const e = parseFloat(document.getElementById(`pt_${p}_end`).value);
  const vals = [s,m,e].filter(v=>!isNaN(v));
  const cell = document.getElementById(`pt_${p}_result`);
  if(!vals.length){ cell.innerHTML='-'; return; }
  const ok = vals.every(v=>v>=threshold);
  cell.innerHTML = ok? '<span class="pass">✓ PASS</span>' : `<span class="fail">✕ FAIL (&lt;${threshold})</span>`;
}

function renderDriverCheck(dc){
  if(dc.style === 'none') return `<div class="hint">เครื่องนี้ไม่มี Driver Check (วัด Torque แทน)</div>`;
  if(dc.style === 'pallet'){
    let grid = '<div class="grid35" id="palletGrid">';
    for(let i=1;i<=dc.count;i++){
      grid += `<div class="pallet-btn" onclick="togglePallet(this,${i})"><div class="num">#${i}</div><div class="mark">-</div></div>`;
    }
    return grid + '</div><div class="hint">แตะเพื่อสลับ O / X / ว่าง</div>';
  }
  if(dc.style === 'every_n'){
    let grid = '<div class="grid35" id="palletGrid">';
    for(let i=1;i<=dc.checkpoints;i++){
      grid += `<div class="pallet-btn" onclick="togglePallet(this,${i})"><div class="num">(${i})</div><div class="mark">-</div></div>`;
    }
    return grid + `</div><div class="hint">เช็คทุก ${dc.n} ชิ้น — รวม ${dc.checkpoints} จุดตรวจ</div>`;
  }
  return `<div class="empty">รูปแบบ driver_check ไม่รู้จัก: ${dc.style}</div>`;
}

function attachPalletHandlers(m){ /* placeholder ให้ onclick ทำงานผ่าน global togglePallet ด้านล่าง */ }

function togglePallet(el, i){
  const mark = el.querySelector('.mark');
  const cur = mark.textContent;
  const next = cur === '-' ? '✓' : (cur === '✓' ? '✕' : '-');
  mark.textContent = next;
  el.classList.remove('ok','ng');
  if(next==='✓') el.classList.add('ok');
  if(next==='✕') el.classList.add('ng');
}

/* ---------- 2) WELD LENGTH ---------- */
function renderWeldLengthForm(m){
  const cfg = m.config;
  let html = `<div class="card"><h2>เงื่อนไขการเชื่อม</h2>
    <table><tr><th>Current</th><th>Volt</th><th>Gas Flow</th><th>Wire Dia.</th><th>Wire Type</th></tr>
    <tr><td>${cfg.condition.current}±${cfg.condition.current_tol}</td><td>${cfg.condition.volt}±${cfg.condition.volt_tol}</td>
    <td>${cfg.condition.gas_flow} L/M</td><td>Ø${cfg.condition.wire_dia}</td><td>${cfg.condition.wire_type}</td></tr></table></div>`;

  html += `<div class="card"><h2>ความยาวแนวเชื่อม (มาตรฐาน ${cfg.length_std_min_mm}-${cfg.length_std_max_mm} mm)</h2>
    <table><tr><th>จุด</th><th>Start (mm)</th><th>Middle (mm)</th><th>End (mm)</th></tr>`;
  cfg.points.forEach(p=>{
    html += `<tr><td><b>${p}</b></td>
      <td><input type="number" step="0.1" class="act-input"></td>
      <td><input type="number" step="0.1" class="act-input"></td>
      <td><input type="number" step="0.1" class="act-input"></td></tr>`;
  });
  return html + `</table></div>`;
}

/* ---------- 3) WELD HAMMER CHECK ---------- */
function renderWeldHammerForm(m){
  const cfg = m.config;
  let html = `<div class="card"><h2>เงื่อนไขการเชื่อม</h2>
    <table><tr><th>Current</th><th>Volt</th><th>Gas Flow</th><th>Wire Dia.</th><th>Wire Type</th></tr>
    <tr><td>${cfg.condition.current}±${cfg.condition.current_tol}</td><td>${cfg.condition.volt}±${cfg.condition.volt_tol}</td>
    <td>${cfg.condition.gas_flow}±${cfg.condition.gas_flow_tol} L/M</td><td>Ø${cfg.condition.wire_dia}</td><td>${cfg.condition.wire_type}</td></tr></table></div>`;

  html += `<div class="card"><h2>ค้อนเคาะ + Visual Check</h2>
    <table><tr><th>ช่วง</th><th>เวลา</th><th>ผล</th><th>LOT No.</th><th>ผู้ตรวจ</th></tr>`;
  ['Start','Middle','End'].forEach(stage=>{
    html += `<tr><td>${stage}</td>
      <td><input type="time" class="act-input" style="width:90px"></td>
      <td><select style="width:80px"><option>-</option><option>OK</option><option>NG</option></select></td>
      <td><input class="act-input" style="width:90px"></td>
      <td><input class="act-input" style="width:100px"></td></tr>`;
  });
  return html + `</table></div>`;
}

/* ---------- 4) WELD ZERO-SET LOG ---------- */
function renderWeldZerosetForm(m){
  const cfg = m.config;
  let html = `<div class="card"><h2>เงื่อนไขการเชื่อม (${cfg.cadence})</h2>
    <table><tr><th>Current</th><th>Gas Flow</th><th>Wire Type</th></tr>
    <tr><td>${cfg.condition.current}±${cfg.condition.current_tol}</td><td>${cfg.condition.gas_flow}</td><td>${cfg.condition.wire_type}</td></tr></table></div>`;

  html += `<div class="card"><h2>Zero Set Log — ไม่ผูก LOT การผลิต</h2>
    <div class="desc">บันทึกทุกช่วงเวลาตลอดกะ (ไม่มีก็ปล่อยว่างได้ ระบบจะ log ว่าเช็คแล้ว)</div>
    <table><tr><th>เวลา</th><th>ค่า (ว่าง = ไม่เปลี่ยน)</th><th>ผู้ตรวจ</th></tr>`;
  cfg.time_slots.forEach(t=>{
    html += `<tr><td><b>${t}</b></td><td><input class="act-input" placeholder="-"></td><td><input class="act-input" style="width:100px"></td></tr>`;
  });
  return html + `</table></div>`;
}

/* ---------- INIT ---------- */
initMachineSelect();
renderForm();
</script>
</body>
</html>
